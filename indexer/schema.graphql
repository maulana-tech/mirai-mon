# One row per Mirai event, keyed to the account it belongs to. The web app's Activity feed.
# A payment between two accounts writes two rows: "pay" for the recipient, "sent" for the payer.
type Activity {
  id: ID!
  user: String! @index
  kind: String!
  timestamp: BigInt! @index
  txHash: String!
  from: String
  to: String
  amount: BigInt
  saved: BigInt
  shares: BigInt
  bps: Int
  until: BigInt
  strategy: Int
  # pocket slot the row is about (withdrawals, locks, strategy moves, baskets, open/close)
  pocket: Int
  # basket: true = the saver's own mix, false = follows Smart Money; weights in bps per basket asset
  custom: Boolean
  weights: [Int!]
}

# Running per-account totals, so lifetime numbers need no log scan.
type Saver {
  id: ID!
  totalReceived: BigInt!
  totalSaved: BigInt!
  totalWithdrawn: BigInt!
  payments: Int!
  splitBps: Int
}

# Net deposits per pocket slot (id "<user>_<pocket>"): what payments put in minus what was withdrawn.
# Earnings = the pocket's on-chain value minus this. Reset when a closed slot is reused.
type PocketFlow {
  id: ID!
  user: String! @index
  pocket: Int!
  deposited: BigInt!
}

# Protocol-wide totals (single row, id "mirai").
type Protocol {
  id: ID!
  volume: BigInt!
  saved: BigInt!
  payments: Int!
  savers: Int!
}
